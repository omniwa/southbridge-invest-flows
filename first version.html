<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SouthBridge / Level11 — Setup & Invest Workflows</title>
<style>
  :root {
    --bg: #fafaf9;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --ink-2: #525252;
    --ink-3: #8a8a8a;
    --line: #e5e5e3;
    --line-strong: #c8c8c4;
    --accent: #1f6feb;
    --accent-soft: #e8f0ff;
    --dim: #f4f4f2;
    --pkg-resources:   #64748b;
    --pkg-compliance:  #b45309;
    --pkg-market:      #0e7490;
    --pkg-investment:  #1d4ed8;
    --pkg-dealing:     #6d28d9;
    --pkg-daily:       #047857;
    --pkg-report:      #be185d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    display: grid;
    grid-template-columns: 280px 1fr 380px;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header header"
      "sidebar main detail";
    height: 100vh;
    overflow: hidden;
  }

  header {
    grid-area: header;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .subtitle { font-size: 12px; color: var(--ink-3); }
  header .spacer { flex: 1; }
  header .legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink-2); flex-wrap: wrap; }
  header .legend span.dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle;
  }

  aside.sidebar {
    grid-area: sidebar;
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 20px 0;
  }
  .sidebar h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-3); margin: 0 24px 8px;
  }
  .action-list { list-style: none; margin: 0 0 20px; padding: 0; }
  .action-list li {
    padding: 10px 24px; cursor: pointer; border-left: 2px solid transparent;
    font-size: 13px; color: var(--ink); user-select: none; transition: background 0.1s;
  }
  .action-list li:hover { background: var(--dim); }
  .action-list li.active {
    background: var(--accent-soft); border-left-color: var(--accent);
    color: var(--accent); font-weight: 500;
  }
  .action-list li .meta {
    display: block; font-size: 11px; color: var(--ink-3);
    font-weight: 400; margin-top: 2px;
  }
  .action-list li.active .meta { color: var(--accent); opacity: 0.8; }

  main {
    grid-area: main;
    overflow: hidden;
    position: relative;
    background: var(--bg);
  }
  .canvas-wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  svg.diagram { width: 100%; height: 100%; max-width: 1300px; }

  .module-rect {
    fill: var(--panel);
    stroke: var(--line-strong);
    stroke-width: 1;
    transition: stroke 0.2s, fill 0.2s;
  }
  .module-rect.active { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
  .module-rect.dim { opacity: 0.4; }
  .module-stripe { stroke-width: 0; }
  .module-stripe.dim { opacity: 0.4; }
  .module-label {
    font-size: 13px; font-weight: 600; fill: var(--ink); pointer-events: none;
  }
  .module-sub {
    font-size: 10.5px; fill: var(--ink-3); pointer-events: none;
  }
  .module-pkg {
    font-size: 9px; fill: var(--ink-3); pointer-events: none;
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
  }
  .module-active .module-label { fill: var(--accent); }
  .module-dim .module-label,
  .module-dim .module-sub,
  .module-dim .module-pkg { opacity: 0.4; }

  .flow-path {
    fill: none; stroke: var(--accent);
    stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
  }
  .flow-label-bg {
    fill: var(--panel); stroke: var(--line); stroke-width: 1;
  }
  .flow-label { font-size: 10px; fill: var(--ink-2); font-weight: 500; }
  .flow-step-num { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
  .flow-step-num-text {
    font-size: 10px; font-weight: 600; fill: white;
    text-anchor: middle; dominant-baseline: central;
  }

  aside.detail {
    grid-area: detail;
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 24px;
  }
  .detail h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); margin: 0 0 6px; font-weight: 600;
  }
  .detail .action-title {
    font-size: 18px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .detail .action-desc {
    font-size: 13px; color: var(--ink-2); margin: 0 0 24px;
  }
  .pkg-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 24px; }
  .pkg-chip {
    font-size: 10px; padding: 2px 8px; border-radius: 999px;
    color: white; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .steps li {
    position: relative; padding: 0 0 18px 32px;
    border-left: 1px dashed var(--line-strong); margin-left: 11px;
  }
  .steps li:last-child { border-left-color: transparent; }
  .steps li::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: -11px; top: -2px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: white;
    font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .steps .from-to {
    font-size: 12px; color: var(--ink);
    font-weight: 600; margin-bottom: 2px;
  }
  .steps .from-to .arrow { color: var(--ink-3); margin: 0 4px; font-weight: 400; }
  .steps .label { font-size: 12px; color: var(--ink-2); }

  .empty {
    color: var(--ink-3); font-size: 13px;
    text-align: center; padding: 40px 20px;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header>
  <h1>SouthBridge / Level11</h1>
  <span class="subtitle">Setup & Invest Workflows</span>
  <span class="spacer"></span>
  <span class="legend">
    <span><span class="dot" style="background:var(--pkg-resources)"></span>Resources</span>
    <span><span class="dot" style="background:var(--pkg-compliance)"></span>Compliance</span>
    <span><span class="dot" style="background:var(--pkg-market)"></span>Market</span>
    <span><span class="dot" style="background:var(--pkg-investment)"></span>Investment</span>
    <span><span class="dot" style="background:var(--pkg-dealing)"></span>Dealing</span>
    <span><span class="dot" style="background:var(--pkg-daily)"></span>Daily</span>
    <span><span class="dot" style="background:var(--pkg-report)"></span>Report</span>
  </span>
</header>

<aside class="sidebar">
  <h2>Actions</h2>
  <ul class="action-list" id="actionList"></ul>
</aside>

<main>
  <div class="canvas-wrap">
    <svg class="diagram" id="diagram" viewBox="-40 0 1330 580" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
        </marker>
      </defs>
      <g id="nodes"></g>
      <g id="edges"></g>
    </svg>
  </div>
</main>

<aside class="detail" id="detail">
  <div class="empty">Select an action on the left to see the data flow between screens.</div>
</aside>

<script>
/* ---------- Data ----------------------------------------------------- */
const PKG_COLOR = {
  Resources:  "var(--pkg-resources)",
  Compliance: "var(--pkg-compliance)",
  Market:     "var(--pkg-market)",
  Investment: "var(--pkg-investment)",
  Dealing:    "var(--pkg-dealing)",
  Daily:      "var(--pkg-daily)",
  Report:     "var(--pkg-report)"
};

const W = 220, H = 90;
const COLS = [40, 290, 540, 790, 1040];
const ROWS = [40, 230, 420];

const DATA = {
  modules: [
    /* Row 1 — Setup */
    { id:"portfolio",       name:"Portfolio",                sub:"Holdings · Model · Currency",         pkg:"Resources",  x:COLS[0], y:ROWS[0] },
    { id:"equity",          name:"Equity / Security",        sub:"Code · Lot · Exchange · ISIN",        pkg:"Resources",  x:COLS[1], y:ROWS[0] },
    { id:"rules",           name:"Manage Rules",             sub:"Limits · Match Portfolios / Securities", pkg:"Compliance", x:COLS[2], y:ROWS[0] },
    { id:"broker-group",    name:"Broker Group",             sub:"Members · Wiggle Room",               pkg:"Dealing",    x:COLS[3], y:ROWS[0] },
    { id:"price-ca",        name:"Price & Corporate Action", sub:"Price Import · XR / XE / XD / XN",    pkg:"Market",     x:COLS[4], y:ROWS[0] },

    /* Row 2 — Pipeline (front half) */
    { id:"invest",          name:"Edit Investment",          sub:"Matrix · Orders · Issues · Submit",   pkg:"Investment", x:COLS[0], y:ROWS[1] },
    { id:"order-placement", name:"Order Placement",          sub:"Place · Block · Push",                pkg:"Dealing",    x:COLS[1], y:ROWS[1] },
    { id:"allocation",      name:"Allocation",               sub:"Deal → Allocate → Confirm",           pkg:"Dealing",    x:COLS[2], y:ROWS[1] },
    { id:"commission",      name:"Commission Adjustment",    sub:"Commission · VAT · WHT",              pkg:"Dealing",    x:COLS[3], y:ROWS[1] },
    { id:"post-alloc",      name:"Post Allocation",          sub:"Final allocation confirm",            pkg:"Dealing",    x:COLS[4], y:ROWS[1] },

    /* Row 3 — Pipeline (back half) */
    { id:"post-tx",         name:"Post Transaction",         sub:"Final daily confirm",                 pkg:"Dealing",    x:COLS[0], y:ROWS[2] },
    { id:"close-tx",        name:"Close Transaction",        sub:"Archive · Posted / Completed",        pkg:"Dealing",    x:COLS[1], y:ROWS[2] },
    { id:"eod",             name:"Process EOD",              sub:"MTM · NAV · P&L",                     pkg:"Daily",      x:COLS[2], y:ROWS[2] },
    { id:"unit-alloc",      name:"Unit Allocation",          sub:"Unit-trust broker confirmation",      pkg:"Daily",      x:COLS[3], y:ROWS[2] },
    { id:"reports",         name:"NAV & Reports",            sub:"Statements · Nav Report · PF1000",    pkg:"Report",     x:COLS[4], y:ROWS[2] }
  ],
  actions: [
    {
      id: "open-order-group",
      name: "Open Order Group",
      desc: "Start an investment session — all setup data is loaded into the Edit Investment screen as context.",
      steps: [
        { from:"portfolio",    to:"invest", label:"Portfolios + model + base / cross currency loaded" },
        { from:"equity",       to:"invest", label:"Securities, lot sizes, exchange and ISIN data" },
        { from:"rules",        to:"invest", label:"Active compliance rules attached to the session" },
        { from:"broker-group", to:"invest", label:"Default broker pool available for placement" },
        { from:"price-ca",     to:"invest", label:"Latest prices and corporate-action adjustments" }
      ]
    },
    {
      id: "submit-investment",
      name: "Submit Investment",
      desc: "Pre-submit rule check runs across the Matrix, then approved orders are dispatched to the dealing desk.",
      steps: [
        { from:"rules",  to:"invest",           label:"Rule sweep populates the Issues tab (Errors block Submit)" },
        { from:"invest", to:"order-placement",  label:"Approved orders queued — TX type, security, units, expiry, priority" }
      ]
    },
    {
      id: "place-order",
      name: "Place Order",
      desc: "The dealer assigns a broker through the Place Order modal and dispatches the order.",
      steps: [
        { from:"broker-group",    to:"order-placement", label:"Broker dropdown filtered by selected group" },
        { from:"order-placement", to:"allocation",      label:"Placed-order row created (status: In Progress)" }
      ]
    },
    {
      id: "deal-allocate",
      name: "Deal & Allocate",
      desc: "Capture executed trade details, distribute units across portfolios, then confirm the allocation.",
      steps: [
        { from:"allocation", to:"allocation", label:"Deal modal: price, commission, VAT, WHT captured → status: Dealt" },
        { from:"allocation", to:"allocation", label:"Allocate modal: dealt units split per portfolio → Allocating / Allocated" },
        { from:"allocation", to:"commission", label:"Confirmed allocation pushed for commission adjustment" }
      ]
    },
    {
      id: "post-allocation-confirm",
      name: "Post Allocation",
      desc: "Adjusted commission, VAT and WHT are reviewed, then the day's allocations are confirmed for booking.",
      steps: [
        { from:"commission", to:"post-alloc", label:"Adjusted commission / VAT / WHT submitted" },
        { from:"post-alloc", to:"post-tx",    label:"Allocations confirmed; daily booking entries queued" }
      ]
    },
    {
      id: "close-transaction",
      name: "Close Transaction",
      desc: "Final daily confirmation archives the transaction as Posted / Completed.",
      steps: [
        { from:"post-tx",  to:"close-tx", label:"Final daily confirm — transaction archived" }
      ]
    },
    {
      id: "process-eod",
      name: "Process EOD",
      desc: "End-of-day batch: posted trades, EOD prices and compliance sweep feed into NAV, P&L and holdings.",
      steps: [
        { from:"close-tx", to:"eod",     label:"Posted transactions handed to EOD batch" },
        { from:"price-ca", to:"eod",     label:"EOD price snapshot + CA effects applied" },
        { from:"rules",    to:"eod",     label:"Post-EOD compliance / limit sweep" },
        { from:"eod",      to:"reports", label:"NAV, P&L and holdings published" }
      ]
    },
    {
      id: "unit-allocation",
      name: "Unit Allocation (Unit Trust)",
      desc: "After the first EOD, broker confirmation for unit-trust orders is keyed in and EOD is re-run with the final units.",
      steps: [
        { from:"eod",        to:"unit-alloc", label:"Initial NAV used to compute estimated units" },
        { from:"unit-alloc", to:"eod",        label:"Broker-confirmed unit allocation re-fed into EOD" },
        { from:"eod",        to:"reports",    label:"Final NAV recomputed and statements published" }
      ]
    },
    {
      id: "apply-corporate-action",
      name: "Apply Corporate Action",
      desc: "A corporate action (XR / XE / XD / XN / Split / Convert) is captured against a security and applied via EOD.",
      steps: [
        { from:"price-ca", to:"equity",  label:"CA event linked to Security Code — par, ratio, price, dates" },
        { from:"price-ca", to:"eod",     label:"Stock / cash entitlements and price adjustments applied" },
        { from:"eod",      to:"reports", label:"Adjusted positions, CA notice and tax breakdown published" }
      ]
    },
    {
      id: "full-pipeline",
      name: "Full Daily Pipeline",
      desc: "End-to-end happy path: Submit → Place → Deal/Allocate → Commission → Post Allocation → Post Transaction → Close → EOD → Reports.",
      steps: [
        { from:"invest",          to:"order-placement", label:"Submit" },
        { from:"order-placement", to:"allocation",      label:"Place" },
        { from:"allocation",      to:"commission",      label:"Deal → Allocate → Confirm" },
        { from:"commission",      to:"post-alloc",      label:"Commission Adjustment Submit" },
        { from:"post-alloc",      to:"post-tx",         label:"Post Allocation Confirm" },
        { from:"post-tx",         to:"close-tx",        label:"Post Transaction Final Confirm" },
        { from:"close-tx",        to:"eod",             label:"Run EOD batch" },
        { from:"eod",             to:"reports",         label:"Publish NAV / statements" }
      ]
    }
  ]
};

/* ---------- Render --------------------------------------------------- */
const moduleById = Object.fromEntries(DATA.modules.map(m => [m.id, m]));
let activeAction = null;

const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function renderNodes() {
  const nodes = document.getElementById("nodes");
  nodes.innerHTML = "";

  DATA.modules.forEach(m => {
    const g = svg("g", { class: "module", "data-id": m.id });

    /* Body rect */
    const rect = svg("rect", {
      x: m.x, y: m.y, width: W, height: H, rx: 8,
      class: "module-rect", "data-id": m.id
    });
    g.appendChild(rect);

    /* Left package-color stripe (always shown) */
    const stripe = svg("rect", {
      x: m.x, y: m.y, width: 4, height: H,
      rx: 2, class: "module-stripe", fill: PKG_COLOR[m.pkg] || "var(--ink-3)"
    });
    g.appendChild(stripe);

    const cx = m.x + W / 2;
    g.appendChild(Object.assign(svg("text", {
      x: cx, y: m.y + 36, "text-anchor": "middle", class: "module-label", "data-id": m.id
    }), { textContent: m.name }));
    g.appendChild(Object.assign(svg("text", {
      x: cx, y: m.y + 55, "text-anchor": "middle", class: "module-sub", "data-id": m.id
    }), { textContent: m.sub }));
    g.appendChild(Object.assign(svg("text", {
      x: cx, y: m.y + 76, "text-anchor": "middle", class: "module-pkg",
      "data-id": m.id, fill: PKG_COLOR[m.pkg] || "var(--ink-3)"
    }), { textContent: m.pkg }));

    nodes.appendChild(g);
  });
}

function renderActionList() {
  const list = document.getElementById("actionList");
  list.innerHTML = "";
  DATA.actions.forEach(a => {
    const li = document.createElement("li");
    li.dataset.id = a.id;
    li.innerHTML = `${a.name}<span class="meta">${a.steps.length} step${a.steps.length === 1 ? "" : "s"}</span>`;
    li.onclick = () => selectAction(a.id);
    list.appendChild(li);
  });
}

/* Compute anchor on a module's bounding box, aimed at a target point */
function anchor(mod, tx, ty) {
  const cx = mod.x + W / 2;
  const cy = mod.y + H / 2;
  const dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const hw = W / 2, hh = H / 2;
  const s = Math.max(Math.abs(dx) / hw, Math.abs(dy) / hh);
  return { x: cx + dx / s, y: cy + dy / s };
}

function renderEdges(action) {
  const edges = document.getElementById("edges");
  edges.innerHTML = "";
  if (!action) return;

  /* Track duplicates per directed pair so they can be offset */
  const pairCount = {};
  action.steps.forEach(s => {
    const k = `${s.from}->${s.to}`;
    pairCount[k] = (pairCount[k] || 0) + 1;
  });
  const pairSeen = {};

  action.steps.forEach((step, i) => {
    const a = moduleById[step.from];
    const b = moduleById[step.to];
    if (!a || !b) return;

    const k = `${step.from}->${step.to}`;
    pairSeen[k] = (pairSeen[k] || 0) + 1;
    const dupIndex = pairSeen[k] - 1;
    const dupTotal = pairCount[k];

    let p1, p2, ctrl, labelPos, numPos;

    if (a.id === b.id) {
      /* Self-loop: arc above the module */
      const arcHeight = 50 + dupIndex * 24;
      p1 = { x: a.x + W * 0.7, y: a.y };
      p2 = { x: a.x + W * 0.3, y: a.y };
      ctrl = { x: a.x + W / 2,  y: a.y - arcHeight };
      labelPos = { x: ctrl.x, y: ctrl.y + 6 };
      numPos   = { x: p1.x - 4, y: p1.y - 14 - dupIndex * 6 };
    } else {
      const aCx = a.x + W / 2, aCy = a.y + H / 2;
      const bCx = b.x + W / 2, bCy = b.y + H / 2;
      p1 = anchor(a, bCx, bCy);
      p2 = anchor(b, aCx, aCy);

      const offset = dupTotal > 1 ? (dupIndex - (dupTotal - 1) / 2) * 26 : 0;
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const baseCurve = 18;
      ctrl = { x: mx + nx * (baseCurve + offset), y: my + ny * (baseCurve + offset) };

      labelPos = {
        x: 0.25 * p1.x + 0.5 * ctrl.x + 0.25 * p2.x,
        y: 0.25 * p1.y + 0.5 * ctrl.y + 0.25 * p2.y
      };
      const nudge = 18 / len;
      numPos = { x: p1.x + (ctrl.x - p1.x) * nudge, y: p1.y + (ctrl.y - p1.y) * nudge };
    }

    /* Path */
    edges.appendChild(svg("path", {
      d: `M ${p1.x} ${p1.y} Q ${ctrl.x} ${ctrl.y} ${p2.x} ${p2.y}`,
      class: "flow-path",
      "marker-end": "url(#arrowhead)"
    }));

    /* Step number bubble */
    edges.appendChild(svg("circle", {
      cx: numPos.x, cy: numPos.y, r: 9, class: "flow-step-num"
    }));
    const numText = svg("text", {
      x: numPos.x, y: numPos.y, class: "flow-step-num-text"
    });
    numText.textContent = i + 1;
    edges.appendChild(numText);

    /* Label with background pill */
    const text = svg("text", {
      x: labelPos.x, y: labelPos.y, "text-anchor": "middle", class: "flow-label"
    });
    text.textContent = step.label;
    edges.appendChild(text);

    const bbox = text.getBBox();
    const padX = 6, padY = 3;
    const bg = svg("rect", {
      x: bbox.x - padX, y: bbox.y - padY,
      width: bbox.width + padX * 2, height: bbox.height + padY * 2,
      rx: 4, class: "flow-label-bg"
    });
    edges.insertBefore(bg, text);
  });
}

function updateNodeStates(action) {
  const involved = new Set();
  if (action) action.steps.forEach(s => { involved.add(s.from); involved.add(s.to); });

  document.querySelectorAll(".module-rect").forEach(r => {
    r.classList.remove("active", "dim");
    if (!action) return;
    if (involved.has(r.dataset.id)) r.classList.add("active");
    else r.classList.add("dim");
  });

  document.querySelectorAll("#nodes .module").forEach(g => {
    const id = g.getAttribute("data-id");
    const isInvolved = !action || involved.has(id);
    g.classList.toggle("module-active", !!action && isInvolved);
    g.classList.toggle("module-dim", !!action && !isInvolved);
  });
}

function renderDetail(action) {
  const el = document.getElementById("detail");
  if (!action) {
    el.innerHTML = '<div class="empty">Select an action on the left to see the data flow between screens.</div>';
    return;
  }
  const involved = new Set();
  action.steps.forEach(s => { involved.add(s.from); involved.add(s.to); });
  const pkgsInvolved = [...new Set(
    [...involved].map(id => moduleById[id]?.pkg).filter(Boolean)
  )];
  const pkgChips = pkgsInvolved.map(p =>
    `<span class="pkg-chip" style="background:${PKG_COLOR[p]}">${p}</span>`
  ).join("");

  const stepsHtml = action.steps.map(s => {
    const fromName = moduleById[s.from]?.name ?? s.from;
    const toName   = moduleById[s.to]?.name   ?? s.to;
    const sameNode = s.from === s.to;
    return `<li>
      <div class="from-to">${fromName}${sameNode ? '' : `<span class="arrow">→</span>${toName}`}</div>
      <div class="label">${s.label}</div>
    </li>`;
  }).join("");

  el.innerHTML = `
    <h3>Workflow</h3>
    <h2 class="action-title">${action.name}</h2>
    <p class="action-desc">${action.desc}</p>
    <h3>Packages involved</h3>
    <div class="pkg-chips">${pkgChips}</div>
    <h3>Steps</h3>
    <ol class="steps">${stepsHtml}</ol>
  `;
}

function selectAction(id) {
  activeAction = DATA.actions.find(a => a.id === id) ?? null;
  document.querySelectorAll(".action-list li").forEach(li => {
    li.classList.toggle("active", li.dataset.id === id);
  });
  renderEdges(activeAction);
  updateNodeStates(activeAction);
  renderDetail(activeAction);
}

/* ---------- Init ----------------------------------------------------- */
renderNodes();
renderActionList();
if (DATA.actions.length) selectAction(DATA.actions[0].id);
</script>

</body>
</html>
